env:
  UPPTIME_GH_PAT: ${{ secrets.GH_PAT }}

name: Update Template CI
on:
  schedule:
    - cron: "0 0 * * *"
  repository_dispatch:
    types: [update_template]
  workflow_dispatch:
jobs:
  release:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Skip without GH_PAT
        if: ${{ env.UPPTIME_GH_PAT == '' }}
        run: |
          echo "::warning title=Skipped template update::Set GH_PAT with repo and workflow permissions so Upptime can update files under .github/workflows/."
      - name: Checkout
        if: ${{ env.UPPTIME_GH_PAT != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_PAT }}
      - name: Update template
        if: ${{ env.UPPTIME_GH_PAT != '' }}
        uses: upptime/uptime-monitor@master
        with:
          command: "update-template"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
